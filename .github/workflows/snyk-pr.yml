name: Run Snyk scan on PRs

on:
  pull_request:
    branches:
      - master

jobs:
  monitor-baseline-project:
    uses: ./.github/workflows/snyk-push.yml
    with:
      github_ref: ${{ github.base_ref }}
    secrets: inherit

  scan-for-new-issues:
    runs-on: ubuntu-latest
    needs: monitor-baseline-project

    steps:
      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: |
            11
            25

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: mqtt-cli

      - name: Check for new issues
        uses: hivemq/hivemq-snyk-composite-action@964ecf88d2ca59af77cc2718d2a79503479b762e # v2.3.7
        with:
          snyk-args: --org=hivemq-mqtt-cli --configuration-matching=^runtimeClasspath$ mqtt-cli -d
          snyk-token: ${{ secrets.SNYK_TOKEN }}
