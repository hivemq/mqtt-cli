name: Publish

on:
  release:
    types: [ published ]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          cache: gradle
          distribution: temurin
          java-version: |
            11
            25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-disabled: true
      - name: Configure AWS credentials for ECR Public
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::691852750577:role/ecr-gha-public-pull
          aws-region: us-east-1
      # authenticated pulls lift the anonymous 1/s ECR Public cap
      - name: Log in to ECR Public
        run: |
          password=$(aws ecr-public get-login-password --region us-east-1)
          echo "::add-mask::$password"
          echo "ORG_GRADLE_PROJECT_ecrPublicUsername=AWS" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_ecrPublicPassword=$password" >> "$GITHUB_ENV"
      - name: Publish
        env:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          GRGIT_USER: ${{ secrets.JENKINS_GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_dockerHubUsername: ${{ secrets.DOCKER_USERNAME }}
          ORG_GRADLE_PROJECT_dockerHubPassword: ${{ secrets.DOCKER_TOKEN }}
        run: ./gradlew githubRelease gitPublishPush pushOciImage --registry dockerHub --tag . --tag latest # . is a placeholder for the default tag
